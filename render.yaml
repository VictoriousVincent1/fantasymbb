# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trade-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Public site: visitors connect their own leagues, and no league is configured here.
      # Optional: add APP_PASSWORD in the dashboard to limit the site to people you share it with.
